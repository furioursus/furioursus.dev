name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Check for build and type issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # No `version` input — reads it from package.json's `packageManager` field instead, so this
      # and Netlify's Corepack-driven pnpm selection can't drift apart. They already did once:
      # onlyBuiltDependencies's git-dependency entry needs a different value shape depending on
      # the exact pnpm point release (10.30.3 vs 10.34.5 disagree on it), so this and Netlify
      # silently landing on different pnpm versions broke one of them regardless of which format
      # was chosen. See docs/mtg.md.
      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

        # astro check for type/template issues, biome check for lint/format issues
      - name: Run checks
        run: pnpm check

        # ensure build works
      - name: Run Astro build
        run: pnpm build
