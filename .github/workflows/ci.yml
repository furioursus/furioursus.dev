name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    name: Check for build and type issues
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "npm"

      # npm ci over npm install — fails if package-lock.json is out of sync with package.json,
      # instead of silently rewriting the lockfile. No global libvips on GitHub's runners, so
      # sharp installs its prebuilt binary directly; nothing to compile.
      - name: Install dependencies
        run: npm ci

        # catch an unfixed Astro Editor date/filename before `npm run build`'s own `prebuild`
        # hook would silently auto-fix it in this ephemeral checkout — without this, a bad commit
        # on main would build green here while staying broken in the repo. Runs *before* the checks
        # below on purpose: a bare `publishDate` makes `astro check` fail first with an opaque
        # InvalidContentEntryDataError, burying the actual cause.
      - name: Check content dates/filenames
        run: npm run sanitize:dates -- --check

        # astro check for type/template issues, biome check for lint/format issues
      - name: Run checks
        run: npm run check

        # ensure build works
      - name: Run Astro build
        run: npm run build
