backend:
  name: github
  repo: furioursus/furioursus.dev # owner/repo
  branch: main

# Fallback default, only used by collections/fields that don't override it below.
# Astro serves everything under `public/` directly at the site root, so this
# is a safe, working default for any future non-colocated media.
media_folder: "public/uploads"
public_folder: "/uploads"

collections:
  - name: "blog"
    label: "Blog"
    folder: "src/content/blog"
    create: true
    slug: "{{slug}}"
    extension: "md"
    # Shared asset folder, not colocated with the entry — src/content/blog/ is flat
    # (one file per post, matching what non-Astro-aware markdown editors expect).
    # public_folder is a relative path (not a real URL) matching what Astro's
    # `image()` schema helper expects from a flat content file: this is why Decap's
    # own image-preview thumbnail won't render for an existing cover image in the
    # editor UI, even though the path is correct and the build resolves it fine.
    media_folder: "src/assets/blog"
    public_folder: "../../assets/blog"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text" }
      - label: "Cover Image"
        name: "coverImage"
        widget: "object"
        required: false
        fields:
          - { label: "Alt", name: "alt", widget: "string" }
          - { label: "Image", name: "src", widget: "image" }
          - {
              label: "Caption",
              name: "caption",
              widget: "string",
              required: false,
              hint: "Shown below the image. Leave blank to show the Alt text above as the caption. To hide the caption entirely, edit the post's file directly and set `caption: null`.",
            }
          - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - label: "OG Image"
        name: "ogImage"
        widget: "object"
        required: false
        fields:
          - { label: "Alt", name: "alt", widget: "string" }
          - { label: "Image", name: "src", widget: "image" }
      - { label: "Tags", name: "tags", widget: "list", default: [] }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Updated Date", name: "updatedDate", widget: "datetime", required: false }
      - { label: "Pinned", name: "pinned", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "notes"
    label: "Notes"
    folder: "src/content/notes"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Description", name: "description", widget: "text", required: false }
      - { label: "Publish Date", name: "publishDate", widget: "datetime" }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "tags"
    label: "Tags"
    folder: "src/content/tags"
    create: true
    slug: "{{slug}}"
    extension: "md"
    fields:
      - { label: "Title", name: "title", widget: "string", required: false }
      - { label: "Description", name: "description", widget: "text", required: false }
