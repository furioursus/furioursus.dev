overrides:
  sharp: ^0.34.5
allowBuilds:
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  esbuild: true
  sharp: true
# Git-hosted deps aren't covered by pnpm's built-in trusted-package list (unlike sharp/esbuild/etc.
# above, which are), so astro-mtg-collection's own `prepare` build script (tsc -> dist/, see its
# package.json) needs an explicit allowlist entry here or pnpm install refuses to run it.
onlyBuiltDependencies:
  - "astro-mtg-collection@https://codeload.github.com/furioursus/astro-mtg-collection/tar.gz/149f9700955dab7333dcc4fdc0444b0b8d2aa7e6"
