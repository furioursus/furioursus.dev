overrides:
  sharp: ^0.34.5
allowBuilds:
  "@biomejs/biome": true
  "@tailwindcss/oxide": true
  esbuild: true
  # false, not true — deliberately turned OFF for sharp specifically, unlike the others above.
  # sharp's own install script auto-detects a *global* libvips (via pkg-config) and prefers linking
  # against it over its own bundled prebuilt binary whenever one's found — on a machine with, say,
  # Homebrew's `vips` installed for some unrelated tool, that means pnpm's normal install would
  # always try to compile sharp from source against it, which fails without a full node-gyp
  # toolchain (node-addon-api, Xcode CLT, etc.) and takes the whole `pnpm install` down with it.
  # Disabling this lets pnpm skip that automatic build entirely; the root `postinstall` script
  # (package.json) then does the actual rebuild itself with `SHARP_IGNORE_GLOBAL_LIBVIPS=1` set,
  # which forces sharp to always use its portable prebuilt binary regardless of what's globally
  # installed on the machine — the only behavior that's actually correct for a project deployed to
  # Netlify, where there's no global libvips to speak of anyway.
  sharp: false
# Git-hosted deps aren't covered by pnpm's built-in trusted-package list (unlike sharp/esbuild/etc.
# above, which are), so astro-mtg-collection's own `prepare` build script (tsc -> dist/, see its
# package.json) needs an explicit allowlist entry here or pnpm install refuses to run it.
onlyBuiltDependencies:
  - "astro-mtg-collection@https://codeload.github.com/furioursus/astro-mtg-collection/tar.gz/4ccf9f159030931d56bfc9d2fef6c1bf32ac69b4"
